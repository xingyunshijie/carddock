name: Test, build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test_setup.js && node --check app/static/app.js && node --check app/static/access-key.js
      - run: python3 packaging/help_page.py && git diff --exit-code app/static/help.html CardDock-help.html
      - run: python3 packaging/release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: dist/*-install.zip
  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and smoke test native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(cat VERSION)
          docker build --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} --label org.opencontainers.image.version="$VERSION" -t "carddock:$VERSION-$ARCH" .
          python3 packaging/smoke.py "carddock:$VERSION-$ARCH"
          mkdir -p dist
          docker save "carddock:$VERSION-$ARCH" | gzip > "dist/carddock-$VERSION-$ARCH.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: dist/*.tar.gz
          compression-level: 0
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish fixed-version images and release attachments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for ARCH in amd64 arm64; do
            gunzip -c "dist/carddock-$VERSION-$ARCH.tar.gz" | docker load
            docker tag "carddock:$VERSION-$ARCH" "$IMAGE:$VERSION-$ARCH"
            docker push "$IMAGE:$VERSION-$ARCH"
          done
          docker manifest create "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker manifest push "$IMAGE:$VERSION"
          cp docs/HELP.md "dist/影像归仓-安装与使用帮助.md"
          cp CardDock-help.html dist/
          (cd dist && sha256sum *.zip *.tar.gz *.md *.html > SHA256SUMS)
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "影像归仓 $VERSION" --notes-file CHANGELOG.md "${FLAGS[@]}"
