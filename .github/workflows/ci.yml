name: NAS tests and container checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install checksum-locked local dependencies
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links wheelhouse --require-hashes -r requirements.lock
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
      - name: Check frontend and deployment syntax
        run: |
          node --check app/static/app.js
          node --check app/static/access-key.js
          sh -n runtime/start.sh
          docker compose -f compose.project.yaml config --quiet
      - name: Verify public install package
        run: python packaging/release.py
  container:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify actual official-image deployment on native CPU
        run: python packaging/smoke.py
