<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影像归仓 · 安装配置</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;color:#243f36;background:#f4f8f6}label{display:block;margin:18px 0}input,textarea{display:block;width:95%;padding:10px;margin-top:8px;border:1px solid #bdccc5;border-radius:6px;font:inherit}button{padding:12px;background:#176b55;color:white;border:0;border-radius:6px;cursor:pointer}small,p{line-height:1.7;color:#61796c}#error{color:#a32d26}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>影像归仓 · 安装配置</h1><p>星云视界 出品 · 离线生成，不向网络发送数据。先在 NAS 创建并授权目录，然后下载配置，在 Docker 的“项目”中导入。</p>
<form id="setup"><label>镜像<input id="image" value="ghcr.io/xingyunshijie/carddock:0.12.0-beta.1" required></label><label>外接卡自动挂载父目录<input id="source" placeholder="例如 /mnt/@usb（需核实）" required></label><label>主文件夹<input id="primary" placeholder="例如 /volume1/Media/Imports" required></label><label>备份文件夹（可选，建议不同盘）<input id="backup" placeholder="例如 /volume2/MediaBackup/Imports"></label><label>状态目录（必须独立，不能包含在主备目录内）<input id="state" placeholder="例如 /volume1/docker/carddock-state" required></label><label>其他允许浏览的目标存储区（可选，每行一个，赋予读写权限）<textarea id="extra" rows="2" placeholder="/volume3/AdditionalMedia"></textarea></label><label>运行账户 UID<input id="uid" type="number" min="1" value="1000" required></label><label>运行账户 GID<input id="gid" type="number" min="1" value="1000" required></label><small>请使用 NAS 实际账户 ID；数值只是示例，不能假定所有绿联一致。所有目录必须预先存在。</small><label>访问端口<input id="port" type="number" min="1" max="65535" value="18080" required></label><label>本次随机访问密钥（保存在下载的配置中，请勿公开）<input id="key" type="password" readonly></label><button type="button" id="show">显示/隐藏密钥</button> <button type="submit">下载 compose.yaml</button></form><p id="error" role="alert"></p><p>默认手动运行、源只读；下载后的配置含密钥，切勿提交 GitHub。更新时复用原配置和状态目录，不要重新安装覆盖。</p><script src="setup.js"></script></html>
