<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影像归仓 · 访问密钥管理</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"></head><body><main class="release key-manager"><a href="/">← 返回影像归仓</a><h1>访问密钥管理</h1><p>使用 NAS 管理员账号验证身份，无需知道旧访问密钥。</p><article><p class="hint">新安装的初始密钥由安装工具随机生成。已修改过的密钥不会自动恢复为初始值。</p><form id="keyForm"><label>NAS 管理员账号<input id="adminUser" autocomplete="username" required maxlength="64" placeholder="管理员账号"></label><label>NAS 管理员密码<input id="adminPassword" type="password" autocomplete="current-password" required placeholder="输入该账号登录 NAS 的密码"></label><fieldset class="run-mode"><legend>修改方式</legend><div class="mode-options"><label><input type="radio" name="keyMode" value="custom" checked><span>自定义新密钥</span></label><label><input type="radio" name="keyMode" value="random"><span>随机重置</span></label></div></fieldset><div id="customFields"><label>新访问密钥<input id="newKey" type="password" autocomplete="new-password" minlength="8" maxlength="128" pattern="[A-Za-z0-9_-]{8,128}" required></label><label>再次输入新密钥<input id="confirmKey" type="password" autocomplete="new-password" required></label><p class="hint">8–128 位字母、数字、下划线或短横线。</p></div><p id="keyNotice" role="status" aria-live="polite"></p><button type="submit" class="primary" id="changeKey">验证管理员并修改密钥</button></form><section id="keyResult" hidden><h2>访问密钥已更新</h2><p>旧密钥已失效。请保存新密钥，其他浏览器需重新连接。</p><label>新访问密钥<input id="resultKey" type="password" readonly autocomplete="off"></label><button id="showKey" type="button">显示密钥</button> <button id="copyKey" type="button">复制密钥</button><p><a href="/">返回影像归仓 →</a></p></section><p class="hint">管理员密码仅用于本次 NAS 身份验证，不保存。密钥更新立即生效，无需重启，不中断正在进行的拷贝任务。</p></article></main><script src="/access-key.js"></script></body></html>
