<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访问密钥管理</title><link rel="stylesheet" href="/style.css"><main class="release"><a href="/">← 返回影像归仓</a><h1>访问密钥管理</h1><article><p>此 NAS 尚未安装网页管理员认证扩展。</p><p>请由 NAS 管理员在安装目录打开终端，运行：</p><pre>sudo python3 access-key.py reset --compose-file deployment/compose.json</pre><p>添加 <code>--custom</code> 可自行设置新密钥；默认随机重置。新密钥立即生效，旧密钥失效。</p><p>如果使用其他部署配置，请将命令中的文件路径替换为实际路径。安装适配本机的认证扩展并启用 HTTPS 后，即可在网页验证管理员身份。</p><p>新安装初始密钥为 <strong>CardDock</strong>。更新保留已有密钥。</p></article></main></html>
